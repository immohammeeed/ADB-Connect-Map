<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>Phone Dashboard</h1>
      <div class="chips"><p id="status" class="status">Connecting…</p><p id="model" class="chip">–</p></div>
    </div>
    <label class="seed">Seed color <input type="color" id="seed" value="#6750a4"></label>
  </header>

  <main class="grid">
    <section class="card hero c-primary">
      <h2>Battery</h2>
      <p class="big"><span id="battery-level">–</span><small>%</small></p>
      <svg class="wave" data-bar="battery" viewBox="0 0 300 28" preserveAspectRatio="none" aria-hidden="true">
        <path class="track"/><path class="active"/>
      </svg>
      <p class="detail" id="battery-detail">–</p>
    </section>

    <section class="card c-tertiary">
      <h2>Storage</h2>
      <p class="big"><span id="storage-percent">–</span><small>%</small></p>
      <svg class="wave" data-bar="storage" viewBox="0 0 300 28" preserveAspectRatio="none" aria-hidden="true">
        <path class="track"/><path class="active"/>
      </svg>
      <p class="detail" id="storage-detail">–</p>
    </section>

    <section class="card c-secondary">
      <h2>RAM</h2>
      <p class="big"><span id="ram-percent">–</span><small>%</small></p>
      <svg class="wave" data-bar="ram" viewBox="0 0 300 28" preserveAspectRatio="none" aria-hidden="true">
        <path class="track"/><path class="active"/>
      </svg>
      <p class="detail" id="ram-detail">–</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
